name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    - name: Install Task
      uses: arduino/setup-task@v1
      with:
        version: '3.x'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Run setup
      run: task setup
      
    - name: Build
      run: task build
      
    - name: Create Release Archive
      run: |
        cd ${{ github.workspace }}
        zip -r Release/atem-plugin.zip dev.flowingspdg.atem.sdPlugin/
      
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: Release/atem-plugin.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
