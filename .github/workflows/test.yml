name: Test

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        
    - name: Install Task
      uses: arduino/setup-task@v1
      with:
        version: '3.x'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Run setup
      run: task setup
      
    - name: Run tests
      run: task test
      
    - name: Run vet
      run: task vet
